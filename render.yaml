services:
  - type: web
    name: ict-assessment
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build:render && npm --prefix backend ci --include=dev && npm --prefix backend run db:generate && npm --prefix backend run db:deploy
    startCommand: npm --prefix backend run db:bootstrap && npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ict-assessment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: ""
      - key: PUBLIC_APP_URL
        value: ""
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
databases:
  - name: ict-assessment-db
    databaseName: ict_assessment
    plan: free
    region: singapore
